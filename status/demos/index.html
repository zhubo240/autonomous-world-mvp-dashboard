    const views=[{id:'timeline',name:'演化时间线',theory:'变化谱系',question:'哪些状态真正改变？',result:'线索到正文；观察缺口促成任务设置调整',help:'追踪前后状态及后继证据；排程和例行活动不等同于验证。'}, {id:'evidence',name:'调整证据台',theory:'可证伪的试验',question:'调整是否兑现预期？',result:'已有实测；巡阅调整及新的先后安排待验证',help:'以预期、实测结果、反例和复验区分试验成功与待证。'}, {id:'capabilities',name:'能力成长图',theory:'能力可复用',question:'什么已达到可重复阶段？',result:'正文单次通过；新版观察已运行，仍待复现',help:'机制存在不代表实际能力；单次通过不代表长期或跨场景可重复。'}, {id:'handoffs',name:'系统接力图',theory:'自主闭环',question:'哪一段真实接手，哪一段等待？',result:'组织交付已核对；外部信号回接待验证',help:'以真实的触发、接手、交付和回传为信号，区分治理发起与自主触发。'}, {id:'decisions',name:'治理决策台',theory:'例外治理',question:'现在有哪些问题必须我决定？',result:'暂无可核对的待裁决事项',help:'只突出有证据、确需治理者裁决的问题。记录缺失不等于不存在；系统可独立继续。'}];
    const state={round:'stagger',filter:'all',adjustment:'stagger',cap:'read',handoff:'signals',node:3,decision:'open'};
    const $=id=>document.getElementById(id),event=id=>data.events.find(e=>e.id===id),badge=(s,t='')=>`<span class="pill ${t}">${s}</span>`,button=(text,action,value,pressed=false)=>`<button type="button" class="action" data-action="${action}" data-value="${value}" aria-pressed="${pressed}">${text}</button>`;
    const navs=[{id:'overview',name:'总览'},...views,{id:'compare',name:'组合比较'}];
    function parseRoute(){const [id,selection='']=location.hash.slice(1).split('/');return {id:navs.some(v=>v.id===id)?id:'overview',selected:views.map(v=>v.id).filter(x=>selection.split(',').includes(x))};}
    function pageHead(title,desc){return `<div class="page-head"><span class="eyebrow">实际记录摘要 · ${data.date}</span><h1>${title}</h1><p class="muted">${desc}</p></div>`}
    function viewHead(id){const v=views.find(x=>x.id===id);return `<div class="view-title"><div class="cluster">${parseRoute().id==='compare'?`<h2>${v.name}</h2>`:''}${badge(v.theory,'blue')}</div><details class="help"><summary>判断依据</summary><p>${v.help}</p></details></div>`}
    function signal(label,value,desc){return `<div class="signal"><div><span class="label">${label}</span><div class="metric">${value}</div></div><p>${desc}</p></div>`}
    function summary(){return `<div class="summary-grid" aria-label="截至当日实际状态"><div class="card summary-tile"><span class="label">日常巡阅</span><div class="metric">1 轮已运行</div>${badge('两渠道仅线索','warn')}<p class="muted">首次调度的实际结果。</p></div><div class="card summary-tile"><span class="label">正文读取</span><div class="metric">2 渠道单次通过</div>${badge('定时复现待验证','warn')}<p class="muted">不是两轮定时巡阅。</p></div><div class="card summary-tile"><span class="label">内部演化</span><div class="metric">新旧首轮均已运行</div>${badge('巡阅调整待验证','warn')}<p class="muted">新版观察发现外部回报缺口。</p></div><div class="card summary-tile"><span class="label">外部信号</span><div class="metric">首条基线已建立</div>${badge('任务已错开','blue')}<p class="muted">下轮是否及时接上仍待验证。</p></div><div class="card summary-tile"><span class="label">本地只读来源</span><div class="metric">初始化完成</div>${badge('增量待验证','warn')}<p class="muted">约定范围已覆盖；内容不公开。</p></div><div class="card summary-tile"><span class="label">组织交付</span><div class="metric">5 视角已交付</div>${badge('外网技术验证','good')}<p class="muted">最终形态仍在比较。</p></div></div>`}
    function evidenceList(ids){return `<ul class="evidence-items">${ids.map(id=>{const e=event(id);return `<li><div class="row-head"><b>${e.name}</b>${badge(e.status,e.tone)}</div><p>${e.result}</p><p class="muted small">${data.date} · ${e.source}</p></li>`}).join('')}</ul>`}
    function overview(){return pageHead('世界演化 · 五种视角','比较同一组实际运行、变更与交付记录。以下是截至当日该阶段已核对的事实；选择任一视角或自由组合。')+summary()+`<section class="card choice-panel"><div class="split"><div><h2>组合比较</h2><p class="muted small">选择哪些视角值得在同一页面持续查看。无默认最终组合。</p></div><a class="action primary" href="#compare">选择组合</a></div></section><div class="cards">${views.map(v=>`<a class="card perspective" href="#${v.id}"><div class="split"><span class="eyebrow">${v.theory}</span>${badge('实际记录','good')}</div><h2>${v.name}</h2><p class="muted">${v.question}</p><p class="result"><b>当前焦点：</b>${v.result}</p><span class="open">打开此视角</span></a>`).join('')}</div><p class="compact-note">首条外部来源基线不代表已发现新增；最新观察无待裁决事项记录，其他 Agent 间自主互动没有足够证据时不填充。</p>`}
    function timeline(){const visible=data.events.filter(e=>state.filter!=='changes'||e.kind!=='routine'),e=event(state.round);return viewHead('timeline')+signal('实际转折','从线索到正文；从缺口到调整','单次读取验证与首轮调度不同；新版观察实际运行后，外部信号到达过晚，促成任务设置调整，效果待验证。')+`<div class="layout"><section class="card"><div class="split section-head"><div><h3>同日事件序列</h3><p class="muted small">${data.date} · 相对顺序，非等间隔</p></div><div class="cluster">${button('全部','filter','all',state.filter==='all')}${button('收拢例行运行','filter','changes',state.filter==='changes')}</div></div><ol class="timeline-list">${visible.map(x=>`<li class="${x.kind}"><button type="button" class="round" data-action="round" data-value="${x.id}" aria-pressed="${e.id===x.id}"><span class="split"><span class="small muted">记录 ${x.order}</span>${badge(x.status,x.tone)}</span><b>${x.name}</b><span class="muted small">${x.after}</span></button></li>`).join('')}</ol></section><section class="card stack"><div><div class="split"><span class="eyebrow">${data.date} · 记录 ${e.order}</span>${badge(e.status,e.tone)}</div><h2 style="margin-top:.35rem">${e.name}</h2></div><div class="compare"><div><span class="label">变更之前</span><b>${e.before}</b></div><div><span class="label">变更之后</span><b>${e.after}</b></div></div><div><div class="step"><b>触发依据</b><p>${e.cause}</p></div><div class="step"><b>实际动作</b><p>${e.action}</p></div><div class="step"><b>验证结果</b><p>${e.result}</p></div><div class="step"><b>后继影响</b><p>${e.next}</p></div></div><p class="status-note">证据：${e.source}。仅展示公开摘要。</p></section></div>`}
    function evidence(){const a=data.adjustments.find(x=>x.id===state.adjustment);return viewHead('evidence')+signal('效果证据','单次通过 ≠ 已复现','读取方法、巡阅调整、节奏变化与看板交付分别评价，不共享一个成功标签。')+`<div class="tablist" aria-label="选择调整">${data.adjustments.map(x=>button(`<b>${x.name}</b><br>${badge(x.status,x.tone)}`,'adjustment',x.id,x.id===a.id)).join('')}</div><section class="card stack"><div class="split"><h2>${a.name}</h2>${badge(a.status,a.tone)}</div><div class="compare"><div><span class="label">原基线</span><b>${a.before}</b></div><div><span class="label">新做法</span><b>${a.after}</b></div></div><div class="grid2"><div class="detail-box"><h3>验证条件</h3><p>${a.condition}</p></div><div class="callout ${a.tone==='warn'?'warn':'info'}"><h3>实际结果 · ${data.date}</h3><p>${a.result}</p></div></div></section><div class="grid2" style="margin-top:.85rem"><section class="card"><h3 class="section-head">验收状态</h3><ul class="rows">${a.items.map(i=>`<li><div class="row-head"><b>${i.name}</b>${badge(i.status,i.tone)}</div><p class="small muted">${i.detail}</p></li>`).join('')}</ul><div class="callout warn" style="margin-top:.85rem"><h3>下一步／失败边界</h3><p>${a.next}</p></div></section><section class="card"><h3 class="section-head">相关实证</h3>${evidenceList(a.events)}</section></div>`}
    function capabilities(){const c=data.capabilities.find(x=>x.id===state.cap);return viewHead('capabilities')+signal('能力级别','正文已单次通过','并无定时复现的实际记录。组织交付的技术验证也不代表一般自主执行能力。')+`<section class="card"><div class="split section-head"><h3>能力与证据阶梯</h3><p class="muted small">点选任一能力查看边界</p></div><div class="cap-matrix" role="table" aria-label="能力阶段"><div class="matrix-head" role="row"><span role="columnheader">能力</span><span role="columnheader">机制／配置</span><span role="columnheader">实际行动</span><span role="columnheader">复现／闭环</span></div>${data.capabilities.map(x=>`<div class="cap-row ${x.id===c.id?'active':''}" role="row"><div role="rowheader" style="display:grid"><button type="button" class="action" data-action="cap" data-value="${x.id}" aria-pressed="${x.id===c.id}">${x.name}</button></div>${x.cells.map(([label,tone])=>`<div role="cell" class="cap-cell ${tone}">${label}</div>`).join('')}</div>`).join('')}</div><p class="compact-note">绿色表示已有具体执行或验证；蓝色为配置或部分证据；黄色为仍待核对；灰色为暂无可核对证据。</p></section><div class="grid2 cap-detail"><section class="card"><h2>${c.name} · 已知边界</h2><p style="margin-top:.65rem">${c.detail}</p><div class="callout warn" style="margin-top:.85rem"><h3>还缺什么？</h3><p>${c.gap}</p></div></section><section class="card"><h3 class="section-head">支持这一判定的记录</h3>${evidenceList(c.events)}</section></div>`}
    function handoffs(){const h=data.handoffs.find(x=>x.id===state.handoff),n=h.nodes[state.node];return viewHead('handoffs')+signal('可核对的链路','组织交付已核对','首轮内部检查已给出调整，尚未收到对应系统的验证回报；外部信号驱动的新闭环暂无证据。')+`<div class="tablist" aria-label="选择接力路径">${data.handoffs.map(x=>button(`<b>${x.name}</b><br>${badge(x.tag,x.tone)}`,'handoff',x.id,x.id===h.id)).join('')}</div><section class="card"><div class="split section-head"><div><h3>责任与交接</h3><p class="muted small">触发：${h.trigger} · ${data.date}</p></div>${badge(h.tag,h.tone)}</div><ol class="handoff-map" style="--count:${h.nodes.length}">${h.nodes.map((x,i)=>`<li><button type="button" class="node ${x.tone==='warn'||!x.tone?'wait':''}" data-action="node" data-value="${i}" aria-pressed="${i===state.node}"><small>${x.owner}</small><b>${x.role}</b>${badge(x.status,x.tone)}</button></li>`).join('')}</ol><p class="compact-note">虚线表示尚待回报或暂无可核对记录，箭头表示预期交接关系，不证明已发生。</p></section><div class="grid2" style="margin-top:.85rem"><section class="card stack"><div class="split"><h2>${n.role}</h2>${badge(n.status,n.tone)}</div><div class="detail-box"><h3>${n.owner}</h3><p>${n.detail}</p></div><p class="status-note">链路证据：${h.evidence}</p></section><section class="card stack"><h2>等待与独立推进</h2><div class="callout warn"><h3>等待什么</h3><p>${h.waiting}</p></div><div class="callout"><h3>仍可继续</h3><p>${h.ongoing}</p></div></section></div>`}
    function decisions(){return viewHead('decisions')+`<section class="card decision-zero"><div><div class="big">—</div><h2>暂无可核对的待裁决事项</h2><p class="muted">${data.date} 新版首轮检查未出现需治理者取舍事项，本快照也无独立登记的未答问题。</p></div><div class="callout"><h3>并非所有等待都要治理者决定</h3><p>巡阅调整验证、下一次定时复现以及调整后外部信号的及时回接，均是系统回报等待。</p></div></section><div class="cluster" style="margin:.85rem 0">${button('待治理者决定','decision','open',state.decision==='open')}${button('已明确的决定','decision','history',state.decision==='history')}${button('系统可继续的工作','decision','continue',state.decision==='continue')}</div>${state.decision==='open'?`<section class="card empty"><p class="eyebrow">真实空状态</p><h2>暂无待答记录</h2><p class="muted">有记录的新问题出现后才列出。此处不提供模拟裁决，也不会代替治理者决定最终看板形态。</p></section>`:state.decision==='history'?`<section class="card history"><h2>已记录的治理决定 · ${data.date}</h2><p class="muted small section-head">展开查看后继证据，不把已明确决定当成待答。</p>${data.resolved.map(x=>`<details><summary>${x.name}　${badge(x.status,'good')}</summary><p>${x.summary}</p><p class="muted small">后继影响：${x.effect}</p></details>`).join('')}</section>`:`<section class="card"><h2 class="section-head">无需新增治理裁决即可推进</h2><ul class="rows"><li><div class="row-head"><b>日常巡阅与正文复现</b>${badge('按计划等待','blue')}</div><p class="muted small">按原任务范围执行并记录后续结果。</p></li><li><div class="row-head"><b>首轮检查提出的调整</b>${badge('待系统回报','warn')}</div><p class="muted small">对应系统自行实施和验证后回传。</p></li><li><div class="row-head"><b>新版观察与外部信号接力</b>${badge('已调整／待复验','warn')}</div><p class="muted small">新版首轮已运行，控制者已错开任务；下轮是否及时回接待验证。</p></li><li><div class="row-head"><b>本地只读来源</b>${badge('初始化完成','good')}</div><p class="muted small">后续增量观察按职责独立运行，能力状态待刷新。</p></li></ul></section>`}`}
    const renderers={timeline,evidence,capabilities,handoffs,decisions};
    function comparePage(selected){return pageHead('组合比较','选择任意视角并在同一页面使用真实数据比较。选择仅写入当前链接的锚点，不修改真实世界，也不设定最终版。')+`<section class="card choice-panel"><div class="split"><h2>选择要并列查看的视角</h2><p class="muted small">已选 ${selected.length} / ${views.length}</p></div><div class="checks" role="group" aria-label="选择组合视角">${views.map(v=>`<label class="check"><input type="checkbox" name="combine" value="${v.id}" ${selected.includes(v.id)?'checked':''}>${v.name}</label>`).join('')}</div><p class="compact-note">勾选即显示在下方；链接可分享，刷新保留选择。无默认组合。</p></section>${selected.length?selected.map(id=>`<section class="view-block" data-panel="${id}">${renderers[id]()}</section>`).join(''):'<section class="card empty"><h2>等待选择视角</h2><p class="muted">勾选上方任意一项或多项，就可以对比各自的结论与交互；也可继续使用独立路径。</p></section>'}`}
    function render(focus){const route=parseRoute();if(!$('navigation').children.length)$('navigation').innerHTML=navs.map(v=>`<a href="#${v.id}">${v.name}</a>`).join('');for(const link of $('navigation').children){if(link.hash==='#'+route.id)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')}const fromCard=document.activeElement?.classList.contains('perspective');$('view').innerHTML=route.id==='overview'?overview():route.id==='compare'?comparePage(route.selected):pageHead(views.find(v=>v.id===route.id).name,views.find(v=>v.id===route.id).question)+`<section class="view-block" data-panel="${route.id}">${renderers[route.id]()}</section>`;document.title=`${navs.find(v=>v.id===route.id).name} · 实际记录摘要`;if(fromCard)$('navigation').querySelector('[aria-current="page"]')?.focus({preventScroll:true});if(focus){const match=[...$('view').querySelectorAll('[data-action]')].find(el=>el.dataset.action===focus[0]&&el.dataset.value===focus[1]);match?.focus({preventScroll:true})}}
    $('view').addEventListener('click',e=>{const control=e.target.closest('button[data-action]');if(!control)return;const{action,value}=control.dataset;switch(action){case 'filter':state.filter=value;if(value==='changes'&&event(state.round).kind==='routine')state.round='reading';break;case 'round':state.round=value;break;case 'adjustment':state.adjustment=value;break;case 'cap':state.cap=value;break;case 'handoff':state.handoff=value;state.node=0;break;case 'node':state.node=Number(value);break;case 'decision':state.decision=value;break;default:return}render([action,value])});
    $('view').addEventListener('change',e=>{if(e.target.name!=='combine')return;const selected=[...$('view').querySelectorAll('input[name="combine"]:checked')].map(x=>x.value);const focus=e.target.value;history.replaceState(null,'','#compare'+(selected.length?'/'+selected.join(','):''));render();$('view').querySelector(`input[name="combine"][value="${focus}"]`)?.focus({preventScroll:true})});
    let previous=parseRoute().id;window.addEventListener('hashchange',()=>{const current=parseRoute().id;render();if(current!==previous)window.scrollTo(0,0);previous=current});render();
  </script>
</body>
</html>
