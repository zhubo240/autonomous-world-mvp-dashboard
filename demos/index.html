    const views = [

    const $=id=>document.getElementById(id), round=id=>sample.rounds.find(r=>r.id===id), badge=(text,tone='')=>`<span class="pill ${tone}">${text}</span>`;
    const btn=(label,action,value,pressed=false,extra='')=>`<button type="button" class="action ${extra}" data-action="${action}" data-value="${value}" aria-pressed="${pressed}">${label}</button>`;
    function mechanism(id){const t=theories[id];return `<section class="mechanism" aria-label="设计判断框架"><div class="mechanism-head"><div><span class="eyebrow">判断框架 · ${t.name}</span><div class="metric-number">${t.signal}</div></div><div><h3>本样本的判断</h3><p class="small">${t.verdict}</p></div></div><details><summary>这版如何判断演化 · 展开设计依据</summary><div class="theory-grid"><div><b>根本问题</b><p>${t.problem}</p></div><div><b>采信信号</b><p>${t.trust}</p></div><div><b>折起或省略</b><p>${t.omit}</p></div><div class="success-fail"><div><b>演化判定</b><p>${t.success}</p></div><div><b>失败判定</b><p>${t.failure}</p></div></div></div></details></section>`}

    function overview(){return header('五种视角，一份演化样本','从变化过程、调整证据、能力增长、系统接力与治理裁决五种角度，比较什么最适合持续查看。','选一个问题作为入口；五种视图的事实、时间和状态一致，但判断标准各不相同。')+strip()+`<div class="overview-grid">${views.map((v,i)=>`<a class="card demo-card" href="#${v.id}"><div class="split"><span class="eyebrow" style="margin:0">DEMO 0${i+1}</span>${badge(v.hint,'blue')}</div><div class="preview ${v.id}" aria-hidden="true">${'<span></span>'.repeat(v.count)}</div><div><p class="theory-name">${theories[v.id].name}</p><h2>${v.name}</h2></div><p class="muted">${v.description}</p><p class="verdict"><b>本样本焦点：</b>${theories[v.id].signal}</p><span class="open">打开演示</span></a>`).join('')}</div><p class="endnote">这里不是正式运行看板。点击任一 Demo 可直接分享该视图的锚点；刷新后仍打开相同视图。</p>`}
    function timeline(){const r=round(state.round);const visible=sample.rounds.filter(x=>!state.hideRoutine||x.kind!=='routine');return header(views[0].name,'以演示轮次为轴，把变化与例行复盘分开。点击轮次查看前后状态。',views[0].read)+strip()+`<div class="layout"><section class="card" aria-label="演化轮次"><div class="split section-label"><h2>轮次序列</h2>${btn(state.hideRoutine?'显示例行轮次':'收拢例行轮次','routine','toggle',state.hideRoutine)}</div><p class="muted small section-label">${visible.length} / ${sample.rounds.length} 轮可见 · 从最早到最新</p><ol class="timeline-list">${visible.map(x=>`<li class="${x.kind}"><button type="button" class="round-button" data-action="round" data-value="${x.id}" aria-pressed="${x.id===r.id}"><span class="split"><span class="small muted">第 ${x.id} 轮</span>${badge(x.tag,x.kind==='routine'?'':x.id===5?'warn':'good')}</span><strong>${x.title}</strong><span class="small muted">${x.after}</span></button></li>`).join('')}</ol></section><section class="card detail" aria-label="当前轮次详情"><div class="split"><span class="eyebrow">当前轮次 · ${r.id}</span>${badge(r.proof,r.id===5?'warn':'blue')}</div><h2>${r.title}</h2><div class="stack"><div class="compare"><div><span class="label">之前</span><b>${r.before}</b></div><div><span class="label">之后</span><b>${r.after}</b></div></div><div><div class="step-row"><b>发生变化</b><p>${r.action}</p></div><div class="step-row"><b>原因</b><p>${r.cause}</p></div><div class="step-row"><b>验证</b><p>${r.verify}</p></div><div class="step-row"><b>后继影响</b><p>${followups[r.id]}</p></div></div><div class="callout"><h3>谁发起？</h3><p>${r.actor}。${r.id===5?'本轮仅提出问题，等待治理裁决。':'不需要治理者催促。'}</p></div></div></section></div>`}
    function evidence(){const a=sample.adjustments.find(x=>x.id===state.adjustment);return header(views[1].name,'按调整而不是按轮次观察，区分方法变化与验证条件。',views[1].read)+strip()+`<div class="evidence-tabs" aria-label="选择调整">${sample.adjustments.map(x=>btn(`<b>${x.name}</b><br><span class="small muted">${x.effect}</span>`,'adjustment',x.id,x.id===a.id)).join('')}</div><div class="evidence-grid"><section class="card wide"><div class="split"><h2>${a.name}</h2>${badge(a.status,a.tone)}</div><div class="compare" style="margin-top:.85rem"><div><span class="label">旧做法</span><b>${a.from}</b></div><div><span class="label">新做法</span><b>${a.to}</b></div></div></section><section class="card"><h2>验证条件</h2><p style="margin-top:.6rem">${a.condition}</p><div class="callout" style="margin-top:1rem"><h3>实际演示结果</h3><p>${a.result}</p></div><div class="callout warn" style="margin-top:.8rem"><h3>什么证据会推翻此结论？</h3><p>${falsifiers[a.id]}</p></div></section><section class="card"><div class="split"><h2>证据轨迹</h2>${badge('独立复验','good')}</div>${evidenceList(a.rounds)}</section><section class="card wide"><div class="split"><h2>结论与下一步</h2>${badge('尚需长期观察','warn')}</div><p style="margin-top:.5rem">${a.next}</p></section></div>`}
    function capabilities(){const c=sample.capabilities.find(x=>x.id===state.capability), current=c.levels.at(-1);return header(views[2].name,'每个格子是相应轮次结束时的能力阶段；选择能力查看升级证据与限制。',views[2].read)+strip()+`<section class="card"><div class="split section-label"><h2>能力 × 演示轮次</h2><p class="muted small">选中行查看详解</p></div><div class="legend" aria-label="阶段图例">${sample.stages.map((s,i)=>`<span class="stage-key"><i class="s${i}"></i>${s.name}</span>`).join('')}</div><div class="matrix"><div class="matrix-head"><span>能力</span>${sample.rounds.map(r=>`<span>轮 ${r.id}</span>`).join('')}</div>${sample.capabilities.map(x=>`<div class="matrix-row ${x.id===c.id?'active':''}"><button type="button" data-action="capability" data-value="${x.id}" aria-pressed="${x.id===c.id}">${x.name}</button>${x.levels.map((l,i)=>`<div class="matrix-cell s${l}" aria-label="第 ${i+1} 轮：${sample.stages[l].name}" title="第 ${i+1} 轮：${sample.stages[l].name}"><span class="stage-long">${sample.stages[l].name}</span><span class="stage-short" aria-hidden="true">${sample.stages[l].short}</span></div>`).join('')}</div>`).join('')}</div></section><div class="cap-detail"><section class="card wide"><div class="split"><h2>${c.name}能力 · 当前阶段</h2>${badge(sample.stages[current].name,current===3?'good':'warn')}</div><div class="stage-track" style="margin-top:.9rem">${sample.stages.map((s,i)=>`<div class="s${i} ${i===current?'current':''}">${s.name}${i===current?' · 当前':''}</div>`).join('')}</div></section><section class="card"><h2>何时转换</h2><p style="margin-top:.55rem">${c.transition}</p>${evidenceList(c.evidence)}</section><section class="card"><h2>距离日常可用还缺什么？</h2><div class="callout warn" style="margin-top:.85rem"><p>${c.gap}</p></div><p class="muted small" style="margin-top:.85rem">可重复只表示当前样本的演示证据，不能等同长期常态可用。</p></section></div>`}
    function handoffs(){const h=sample.handoffs.find(x=>x.id===state.handoff),n=h.nodes[state.node],r=round(n.round),isWaiting=h.id==='direction';return header(views[3].name,'选择一条接力，再点节点检查责任、交付和下一步。',views[3].read)+strip()+`<div class="handoff-selector" aria-label="选择接力路径">${sample.handoffs.map(x=>btn(`<b>${x.name}</b><br><span class="small muted">${x.summary}</span>`,'handoff',x.id,x.id===h.id)).join('')}</div><section class="card"><div class="split section-label"><h2>责任接力</h2>${badge(h.outcome,h.id==='autonomous'?'good':'warn')}</div><ol class="handoff-map">${h.nodes.map((x,i)=>`<li class="${isWaiting&&i===2?'wait-gate':isWaiting&&i===3?'independent':''}"><button type="button" class="node" data-action="node" data-value="${i}" aria-pressed="${i===state.node}"><small>${isWaiting&&i===3?'独立路径':`步骤 ${i+1}`} · ${x.owner}</small><b>${x.role}</b>${badge(x.state,x.tone)}</button></li>`).join('')}</ol><p class="muted small">绿色：完成　蓝色：继续　黄色：等待裁决${isWaiting?'　虚线：不依赖待裁决项':''}</p></section><div class="handoff-detail" style="margin-top:1rem"><section class="card"><div class="split"><h2>${n.role}</h2>${badge(n.state,n.tone)}</div><p class="muted small" style="margin-top:.5rem">责任主体：${n.owner}</p><div class="stack" style="margin-top:.8rem"><div class="detail-box"><h3>承担工作</h3><p>${n.task}</p></div><div class="detail-box"><h3>下一步交付</h3><p>${n.next}</p></div><div class="detail-box"><h3>对应轮次证据 · 第 ${r.id} 轮</h3><p>${r.verify}</p></div></div></section><section class="card"><h2>不催促时会怎样？</h2><div class="queue" style="margin-top:.85rem"><div class="queue-item"><div><b>仍可自行推进</b><p class="muted small">${h.continuing}</p></div>${badge('继续','good')}</div><div class="queue-item"><div><b>等待点</b><p class="muted small">${h.waiting}</p></div>${badge(h.id==='autonomous'?'无阻塞':'待裁决',h.id==='autonomous'?'good':'warn')}</div></div></section></div>`}
    function decisions(){const d=sample.decision,p=sample.decision.options.find(x=>x.id===state.preview);return header(views[4].name,'只展示确实需要治理者选择的虚构问题；预览选择不会改动样本或真实工作。',views[4].read)+strip()+`<div class="decision-layout"><section class="card"><div class="split"><span class="eyebrow">第 ${d.round} 轮 · 唯一待裁决项</span>${badge('待治理者决定','warn')}</div><h2>${d.name}</h2><p class="muted" style="margin-top:.6rem">${d.context}</p><div class="divider" style="margin-top:.9rem"><h3>现有证据</h3>${evidenceList(d.evidence)}</div><div class="divider" style="margin-top:.9rem"><fieldset><legend>选择一个方向作模拟预览</legend><div class="options">${d.options.map(x=>`<label class="option"><input type="radio" name="choice" value="${x.id}" ${state.choice===x.id?'checked':''}><span><b>${x.title}</b><small>${x.desc}</small></span></label>`).join('')}</div></fieldset><div class="cluster"><button type="button" class="action primary" data-action="preview" data-value="apply" ${state.choice?'':'disabled'}>预览模拟影响</button><button type="button" class="action" data-action="reset" data-value="reset">清除模拟</button></div><p class="safe-note">模拟不会提交决定、改变实际世界或写入任何数据。刷新页面后模拟自动清除。</p></div></section><div class="stack"><section class="card"><h2>等待期间</h2><div class="stack" style="margin-top:.8rem"><div class="callout warn"><h3>会等待的工作</h3><p>${d.blocked}</p></div><div class="callout"><h3>仍能自主推进</h3><p>${d.continues}</p></div></div></section><section class="card forecast" aria-live="polite"><span class="eyebrow">模拟预览 · 非真实状态</span><h2>${p?p.title:'尚未预览选择'}</h2>${p?`<ul class="impact-list"><li><b>会解锁</b><p>${p.impact}</p></li><li><b>潜在取舍</b><p>${p.tradeoff}</p></li><li><b>下一步验证</b><p>${p.next}</p></li><li><b>保持不变</b><p>${d.continues}</p></li></ul>`:`<p class="muted" style="margin-top:.65rem">在左侧选择方向并预览。当前演示事实始终是方向待裁决。</p>`}</section></div></div>`}
    const renderers={overview,timeline,evidence,capabilities,handoffs,decisions};
    const currentView=()=>{const id=location.hash.slice(1);return Object.hasOwn(renderers,id)?id:'overview'};
    let renderedView=null;const discussionOpen={};
    function render(focus){const id=currentView(),previous=$('view').querySelector('.mechanism details');if(previous&&renderedView)discussionOpen[renderedView]=previous.open;if(!$('navigation').children.length)$('navigation').innerHTML=[{id:'overview',name:'总览'},...views].map(v=>`<a href="#${v.id}">${v.name}</a>`).join('');for(const link of $('navigation').children){if(link.hash==='#'+id)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')}let fromCard=document.activeElement?.classList.contains('demo-card');$('view').innerHTML=renderers[id]();const discussion=$('view').querySelector('.mechanism details');if(discussion&&Object.hasOwn(discussionOpen,id))discussion.open=discussionOpen[id];renderedView=id;document.title=`${id==='overview'?'五种演化看板 Demo':views.find(v=>v.id===id).name} · 演示数据`;if(fromCard)$('navigation').querySelector('[aria-current="page"]')?.focus({preventScroll:true});if(focus){const match=[...$('view').querySelectorAll('[data-action]')].find(el=>el.dataset.action===focus[0]&&el.dataset.value===focus[1]);if(match&&!match.disabled)match.focus({preventScroll:true});}}
    $('view').addEventListener('click',event=>{const control=event.target.closest('button[data-action]');if(!control||control.disabled)return;const {action,value}=control.dataset;switch(action){case 'routine':state.hideRoutine=!state.hideRoutine;if(state.hideRoutine&&round(state.round).kind==='routine')state.round=4;break;case 'round':state.round=Number(value);break;case 'adjustment':state.adjustment=value;break;case 'capability':state.capability=value;break;case 'handoff':state.handoff=value;state.node=0;break;case 'node':state.node=Number(value);break;case 'preview':state.preview=state.choice;break;case 'reset':state.choice=null;state.preview=null;break;default:return}render([action,value]);});
    $('view').addEventListener('change',event=>{if(event.target.name!=='choice')return;state.choice=event.target.value;state.preview=null;const preview=$('view').querySelector('[data-action="preview"]');preview.disabled=false;$('view').querySelector('.forecast').innerHTML='<span class="eyebrow">模拟预览 · 非真实状态</span><h2>尚未预览选择</h2><p class="muted" style="margin-top:.65rem">选择已更新。点击预览模拟影响，当前样本事实保持不变。</p>';});
    window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();
  </script>
</body>
